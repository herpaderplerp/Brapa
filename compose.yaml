# Podman-compatible (OCI Compose). `podman compose up` reads this unchanged.
services:
  db:
    image: docker.io/postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brapa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brapa}
      POSTGRES_DB: ${POSTGRES_DB:-brapa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brapa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Containerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-brapa}:${POSTGRES_PASSWORD:-brapa}@db:5432/${POSTGRES_DB:-brapa}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - uploads:/app/var/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  uploads:
