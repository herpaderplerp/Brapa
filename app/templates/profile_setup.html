{% extends "base.html" %}
{% block content %}
<section class="card" style="max-width:520px;margin:2rem auto">
  <h1>Set up your profile</h1>
  <p style="color:var(--muted)">Tell other riders who you are.</p>
  <form method="post" action="/onboarding">
    <label for="display_name">Display name *</label>
    <input id="display_name" name="display_name" required maxlength="80"
           value="{{ u.display_name or '' }}" placeholder="e.g. Ride or Die">

    <label for="home_region">Home region</label>
    <input id="home_region" name="home_region" maxlength="120"
           value="{{ u.home_region or '' }}" placeholder="e.g. Pacific Northwest">

    <label for="avatar_url">Avatar URL</label>
    <input id="avatar_url" name="avatar_url" type="url"
           value="{{ u.avatar_url or '' }}" placeholder="https://...">

    <label for="unit_distance">Distance units</label>
    <select id="unit_distance" name="unit_distance">
      <option value="km" {{ 'selected' if u.unit_distance == 'km' else '' }}>Kilometres</option>
      <option value="mi" {{ 'selected' if u.unit_distance == 'mi' else '' }}>Miles</option>
    </select>

    <label for="unit_temp">Temperature units</label>
    <select id="unit_temp" name="unit_temp">
      <option value="C" {{ 'selected' if u.unit_temp == 'C' else '' }}>Celsius</option>
      <option value="F" {{ 'selected' if u.unit_temp == 'F' else '' }}>Fahrenheit</option>
    </select>

    <button class="btn" type="submit" style="margin-top:1.5rem">Save profile</button>
  </form>
</section>
{% endblock %}
